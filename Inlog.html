<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Inloggen – StudyMate</title>
  <style>
    :root{
      --brand:#2193b0; --accent:#6dd5ed; --ink:#0f2942; --muted:#6b7b8c;
      --border:#e4ecf5; --bg:#f4fbff; --danger:#d7263d; --ok:#2e7d32;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 600px at 0% -10%, rgba(33,147,176,.18), transparent 60%),
        radial-gradient(900px 500px at 100% -20%, rgba(109,213,237,.22), transparent 60%),
        linear-gradient(180deg,#ffffff 0%, #f2fbff 40%, #e9f8ff 100%);
    }

    .page{min-height:100dvh; display:flex; flex-direction:column}
    header{width:min(1200px,94vw); margin:28px auto 6px; display:flex; align-items:center; gap:14px}
    .logo{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
      font-weight:900;color:#fff;background:linear-gradient(135deg,var(--brand),var(--accent));
      box-shadow:0 8px 22px rgba(33,147,176,.25)}
    header h1{margin:0;font-size:2rem}
    header .tag{color:var(--muted);margin-top:2px}

    main{
      flex:1; width:min(1200px,92vw); margin:0 auto;
      display:flex; align-items:center; justify-content:center; padding:6px 0 0;
    }
    .card{
      width:min(960px,100%); background:#fff;border:1px solid var(--border);border-radius:24px;
      box-shadow:0 14px 36px rgba(33,147,176,.10); padding:26px;
    }

    .roles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 18px}
    @media(max-width:760px){ .roles{grid-template-columns:repeat(2,1fr)} }
    .role{
      display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;
      padding:16px 12px;border:1px solid var(--border);border-radius:16px;cursor:pointer;user-select:none;background:#fff;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease; min-height:74px;
    }
    .role .ico{font-size:1.6rem;transform:translateY(0);transition:transform .12s ease}
    .role span{font-weight:800}
    .role:hover{transform:translateY(-2px); box-shadow:0 12px 24px rgba(33,147,176,.16); border-color:#cfe6f5;
      background:linear-gradient(180deg,#ffffff, #f6fbff)}
    .role:hover .ico{transform:translateY(-1px)}
    .role[aria-pressed="true"]{border-color:transparent; background:linear-gradient(135deg,var(--brand),var(--accent)); color:#fff;
      box-shadow:0 14px 30px rgba(33,147,176,.24)}

    label{display:block;font-weight:800;margin-top:10px}
    input[type="text"],input[type="password"]{
      width:100%;padding:14px 14px;border:1px solid var(--border);border-radius:12px;outline:none;background:#fcfeff;font-size:1rem
    }
    input:focus{border-color:#b8d7ea; box-shadow:0 0 0 3px rgba(33,147,176,.12)}
    .remember{display:flex;align-items:center;gap:10px;margin:12px 0}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .btn{padding:12px 16px;border-radius:12px;border:1px solid #cfe0ee;background:#fff;font-weight:800;cursor:pointer}
    .btn-primary{background:linear-gradient(135deg,var(--brand),var(--accent));border:none;color:#fff;box-shadow:0 12px 28px rgba(33,147,176,.22)}
    .muted{color:var(--muted)}
    .err{display:none;margin-top:10px;color:#fff;background:var(--danger);padding:10px 12px;border-radius:12px;font-weight:800}
    .ok{display:none;margin-left:10px;color:var(--ok);font-weight:900}

    .quote-wrap{margin:28px 0 24px; width:min(1200px,94vw); align-self:center}
    .quote{
      text-align:center; font-size: clamp(1.3rem, 2.5vw + .6rem, 2.6rem);
      font-weight:900; letter-spacing:.2px; line-height:1.2; margin:0;
      background: linear-gradient(90deg, var(--brand), var(--accent), var(--brand));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      background-size: 200% 100%; animation: slideGradient 12s ease-in-out infinite;
      filter: drop-shadow(0 6px 18px rgba(33,147,176,.15));
    }
    @keyframes slideGradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

    /* ===== Registratie modal (professioneel) ===== */
    .reg-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,41,66,.35);z-index:9999}
    .reg-panel{width:min(560px,92vw);background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 22px 60px rgba(33,147,176,.25)}
    .reg-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .reg-close{margin-left:auto;border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:800}
    .reg-field{display:flex;flex-direction:column;gap:6px;margin:8px 0}
    .reg-input{padding:12px 14px;border:1px solid var(--border);border-radius:12px}
    .reg-help{color:var(--muted)}
    .reg-alert{display:none;margin-top:8px;padding:10px 12px;border-radius:10px;font-weight:800}
    .reg-alert.err{background:#fff1f2;border:1px solid #ffd0d6;color:#8b2332}
    .reg-alert.ok{background:#e8f7f0;border:1px solid #c7eadb;color:#0b6b46}
    /* compacte roltegels in modal */
    .reg-roles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .reg-role{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--border);border-radius:12px;background:#f6fbff;cursor:pointer;user-select:none}
    .reg-role[aria-pressed="true"]{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border-color:transparent}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="logo">SM</div>
      <div>
        <h1>StudyMate</h1>
        <div class="tag">Leren met AI, slimmer & sneller</div>
      </div>
    </header>

    <main>
      <div class="card">
        <h2 style="margin:0 0 14px">Inloggen</h2>

        <div class="roles" role="tablist" aria-label="Kies je rol">
          <button class="role" aria-pressed="true" data-role="student" title="Student">
            <div class="ico">🎒</div><span>Student</span>
          </button>
          <button class="role" aria-pressed="false" data-role="ouder" title="Ouder">
            <div class="ico">👨‍👩‍👧</div><span>Ouder</span>
          </button>
          <button class="role" aria-pressed="false" data-role="docent" title="Docent">
            <div class="ico">🧑‍🏫</div><span>Docent</span>
          </button>
          <button class="role" aria-pressed="false" data-role="school" title="School">
            <div class="ico">🏫</div><span>School</span>
          </button>
        </div>

        <form id="form" autocomplete="on">
          <label for="user">Gebruikersnaam</label>
          <input id="user" name="user" type="text" placeholder="bijv. Thijn Buis"/>

          <label for="pw">Wachtwoord</label>
          <input id="pw" name="pw" type="password" placeholder="••••••••"/>

          <div class="remember">
            <input id="keep" type="checkbox" />
            <label for="keep" style="margin:0;font-weight:700">Ingelogd blijven</label>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">Inloggen</button>
            
            <button type="button" id="openReg" class="btn">Account aanmaken</button>
            <span class="ok" id="ok">Succes! Je gaat zo naar je portaal…</span>
          </div>

          <div id="err" class="err">Ongeldige inlog. Probeer opnieuw.</div>
        </form>

        <div class="muted" style="margin-top:12px">
          Tip: testaccount <strong>Thijn Buis</strong> / <strong>Thijnbuis</strong>
        </div>
      </div>
    </main>

    <div class="quote-wrap">
      <p class="quote" id="quote"></p>
    </div>
  </div>

  <!-- Registratie-modal -->
  <div class="reg-modal" id="regModal" role="dialog" aria-modal="true" aria-labelledby="regTitle">
    <div class="reg-panel">
      <div class="reg-head">
        <h3 id="regTitle" style="margin:0">Account aanmaken</h3>
        <button class="reg-close" id="regClose">✕</button>
      </div>

      <div class="reg-field">
        <label for="regName">Gebruikersnaam
        </label>
        <input id="regName" class="reg-input" placeholder="Gebruikersnaam">
      </div>

      <div class="reg-field">
        <label for="regPass">Wachtwoord</label>
        <input id="regPass" type="password" class="reg-input" placeholder="Minimaal 6 tekens">
      </div>

      <div class="reg-field">
        <label for="regPass2">Wachtwoord herhalen</label>
        <input id="regPass2" type="password" class="reg-input" placeholder="Herhaal wachtwoord">
      </div>

      <div class="reg-field">
        <label>Rol</label>
        <div class="reg-roles" id="regRoles">
          <button class="reg-role" aria-pressed="true"  data-role="student">🎒<span>Student</span></button>
          <button class="reg-role" aria-pressed="false" data-role="ouder">👨‍👩‍👧<span>Ouder</span></button>
          <button class="reg-role" aria-pressed="false" data-role="docent">🧑‍🏫<span>Docent</span></button>
          <button class="reg-role" aria-pressed="false" data-role="school">🏫<span>School</span></button>
        </div>
      </div>

      <div class="reg-row" style="display:flex;gap:10px;align-items:center;margin-top:10px">
        <button id="regCreate" class="btn btn-primary">Aanmaken</button>
        <span id="regMsg" class="reg-help"></span>
      </div>
      <div id="regAlert" class="reg-alert"></div>
    </div>
  </div>

<script>
  /* Quotes */
  const quotes = [
    "Zet de eerste stap – de rest volgt.",
    "Jij × AI = sneller leren, meer onthouden.",
    "Slim studeren vandaag is succes morgen.",
    "De toekomst begint met wat je nu leert.",
    "Elke minuut kennis betaalt zich dubbel terug.",
    "Nieuwsgierig blijven is je superpower.",
    "Fouten maken is leren in actie."
  ];
  document.getElementById('quote').textContent = quotes[Math.floor(Math.random()*quotes.length)];

  /* Rol UI (login) */
  document.querySelectorAll('.role').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.role').forEach(b=>b.setAttribute('aria-pressed','false'));
      btn.setAttribute('aria-pressed','true');
    });
  });

  /* Storage helpers */
  const KEY_USERS='studymate.users';
  const KEY_SESSION='studymate.session';
  function loadJSON(k,def){ try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(def))}catch(e){return def} }
  function saveJSON(k,v){ localStorage.setItem(k, JSON.stringify(v)) }

  // Seed testaccount
  (function seed(){
    const users=loadJSON(KEY_USERS,[]);
    if(!users.find(u=>u.name==='Thijn Buis')){
      users.push({name:'Thijn Buis', pass:'Thijnbuis', role:'student'});
      saveJSON(KEY_USERS, users);
    }
  })();

  /* Inloggen */
  document.getElementById('form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const user = document.getElementById('user').value.trim();
    const pw   = document.getElementById('pw').value.trim();
    const keep = document.getElementById('keep').checked;
    const roleEl = document.querySelector('.role[aria-pressed="true"]');
    const role = roleEl ? roleEl.dataset.role : 'student';
    const err = document.getElementById('err'); err.style.display='none';

    if(!user || !pw){
      err.textContent='Vul je gebruikersnaam en wachtwoord in.'; err.style.display='block'; return;
    }

    const users=loadJSON(KEY_USERS,[]);
    const reg=users.find(u=>u.name.toLowerCase()===user.toLowerCase());
    let valid=false;
    if(reg){ valid = (pw===reg.pass); }
    else{
      const okDemo = (user.toLowerCase()==='thijn buis'||user.toLowerCase()==='thijnbuis') && pw==='Thijnbuis';
      valid = okDemo || pw.length>=3;
    }
    if(!valid){ err.textContent='Ongeldige inlog. Probeer opnieuw.'; err.style.display='block'; return; }

    const sess = {username:user, role, keepLogged:keep, loginAt:new Date().toISOString()};
    try{ localStorage.setItem(KEY_SESSION, JSON.stringify(sess)); }catch(e){}

    document.getElementById('ok').style.display='inline';
    setTimeout(()=>{
      const dir = window.location.pathname.replace(/[^/]*$/, '');
      window.location.replace(dir+'Portaal.html');
    }, 450);
  });

  /* Registratie modal */
  const regModal = document.getElementById('regModal');
  const regMsg   = document.getElementById('regMsg');
  const regAlert = document.getElementById('regAlert');
  const regName  = document.getElementById('regName');
  const regPass  = document.getElementById('regPass');
  const regPass2 = document.getElementById('regPass2');
  let regRole    = 'student';

  document.getElementById('openReg').addEventListener('click', ()=>{
    regMsg.textContent=''; regAlert.style.display='none';
    regName.value=''; regPass.value=''; regPass2.value='';
    // reset rol
    document.querySelectorAll('.reg-role').forEach(b=>b.setAttribute('aria-pressed','false'));
    document.querySelector('.reg-role[data-role="student"]').setAttribute('aria-pressed','true');
    regRole='student';
    regModal.style.display='flex';
  });
  document.getElementById('regClose').addEventListener('click', ()=> regModal.style.display='none');
  regModal.addEventListener('click', (e)=>{ if(e.target===regModal) regModal.style.display='none' });

  // rol toggles in modal
  document.querySelectorAll('.reg-role').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.reg-role').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true'); regRole=b.dataset.role;
    });
  });

  function showAlert(type, text){
    regAlert.className='reg-alert ' + (type==='ok'?'ok':'err');
    regAlert.textContent=text; regAlert.style.display='block';
  }

  // live check op wachtwoord
  function validatePasswords(){
    const p1=regPass.value.trim(), p2=regPass2.value.trim();
    if(p1.length && p1.length<6){ showAlert('err','Wachtwoord is te kort (min. 6 tekens).'); return false; }
    if(p1 && p2 && p1!==p2){ showAlert('err','Wachtwoorden komen niet overeen.'); return false; }
    regAlert.style.display='none'; return true;
  }
  regPass.addEventListener('input', validatePasswords);
  regPass2.addEventListener('input', validatePasswords);

  document.getElementById('regCreate').addEventListener('click', ()=>{
    const name=(regName.value||'').trim();
    const p1=(regPass.value||'').trim();
    const p2=(regPass2.value||'').trim();

    if(!name || !p1 || !p2){ showAlert('err','Vul alle velden in.'); return; }
    if(!validatePasswords()) return;

    const users=loadJSON(KEY_USERS,[]);
    if(users.find(u=>u.name.toLowerCase()===name.toLowerCase())){ showAlert('err','Deze naam bestaat al.'); return; }

    users.push({name, pass:p1, role:regRole});
    saveJSON(KEY_USERS, users);

    // Pre-fill login
    document.getElementById('user').value=name;
    document.getElementById('pw').value=p1;

    showAlert('ok','Account aangemaakt! Je kunt nu inloggen.');
    setTimeout(()=> regModal.style.display='none', 800);
  });

  // Quote init
  document.getElementById('quote').textContent = quotes[Math.floor(Math.random()*quotes.length)];
</script>
</body>
</html>
