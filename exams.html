<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Oefentoetsen – StudyMate</title>
<style>
:root{--brand:#2193b0;--accent:#6dd5ed;--border:#e4ecf5;--muted:#66788b;--ink:#0f2942;--bg:#f7fbff}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{width:min(1200px,92vw);margin:18px auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.back{color:var(--brand);text-decoration:none;font-weight:800}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 10px 28px rgba(33,147,176,.09)}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{padding:8px 12px;border-radius:10px;border:1px solid #cfe0ee;background:#fff;cursor:pointer;font-weight:800}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--accent));border:none;color:#fff;box-shadow:0 8px 22px rgba(33,147,176,.18)}
.table{width:100%;border-collapse:separate;border-spacing:0 10px}
.table th{color:var(--muted);text-align:left;font-weight:800;padding:0 12px}
.table td{background:#fff;border:1px solid var(--border);padding:12px;border-radius:12px}
.badge{padding:4px 10px;border-radius:999px;color:#fff;font-weight:800;background:linear-gradient(135deg,#34d399,#10b981)}
.badge-warn{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a id="back" class="back" href="#">← Terug naar vak</a>
    <span class="muted">Geselecteerd vak: <strong id="vakName">–</strong></span>
  </div>

  <div class="card">
    <h2>Oefentoetsen</h2>
    <p class="muted" style="margin-top:4px">Test jezelf en hou voortgang bij.</p>

    <div class="toolbar">
      <button id="addDemo" class="btn btn-primary">+ Demo-toets</button>
      <button id="sortDate" class="btn">Sorteer op datum</button>
    </div>

    <table class="table">
      <thead><tr><th>Titel</th><th>Datum</th><th>Score</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const KEY='studymate.drive';
const Q=Object.fromEntries(new URLSearchParams(location.search).entries());
const folder = decodeURIComponent(Q.folder||'').trim() || (JSON.parse(localStorage.getItem(KEY)||'{}').selected || '');
document.getElementById('back').href='./vak.html?folder='+encodeURIComponent(folder);
document.getElementById('vakName').textContent=folder||'—';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function ensure(){
  const db=load(); db.folders=db.folders||{};
  db.folders[folder]=db.folders[folder]||{createdAt:new Date().toISOString(),materials:{assignment:[]}};
  db.folders[folder].materials.assignment=db.folders[folder].materials.assignment||[];
  if(db.folders[folder].materials.assignment.filter(x=>x.type==='exam'||x.type==='quiz').length===0){
    db.folders[folder].materials.assignment.push(
      {type:'exam', title:'Proeftoets H1-H2', date:new Date().toISOString(), score:78},
      {type:'quiz', title:'Korte quiz – begrippen', date:new Date(Date.now()-86400000*2).toISOString(), score:92}
    );
    db.folders[folder].lastUpdate=new Date().toISOString(); save(db);
  }
}
function render(){
  const db=load(); const arr=(db?.folders?.[folder]?.materials?.assignment||[]).filter(x=>x.type==='exam'||x.type==='quiz');
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  if(!arr.length){ tb.innerHTML='<tr><td class="muted" colspan="4">Nog geen toetsen.</td></tr>'; return; }
  arr.forEach(it=>{
    const tr=document.createElement('tr');
    const badgeClass = it.score>=80?'badge':(it.score>=60?'badge-warn':'');
    tr.innerHTML=`<td>${it.title}</td>
      <td>${new Date(it.date||Date.now()).toLocaleDateString('nl-NL')}</td>
      <td>${it.score!=null? `<span class="${badgeClass}">${it.score}%</span>`:'—'}</td>
      <td><button class="btn">Open</button></td>`;
    tb.appendChild(tr);
  });
}
document.getElementById('addDemo').onclick=()=>{const db=load(); db.folders[folder].materials.assignment.push({type:'exam', title:'Demo-toets', date:new Date().toISOString(), score:Math.floor(60+Math.random()*40)}); db.folders[folder].lastUpdate=new Date().toISOString(); save(db); render();}
document.getElementById('sortDate').onclick=()=>{const db=load(); db.folders[folder].materials.assignment.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)); save(db); render();}
ensure(); render();
</script>
</body>
</html>
